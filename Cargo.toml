[package]
name = "rotatelog"
version = "0.1.0"
edition = "2021"
description = "Rotates a single log file by size or age with a pruned .1/.2/.3 history and optional gzip — logrotate's core job, usable standalone on any file without syslog integration"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/rotatelog"
readme = "README.md"
keywords = ["logrotate", "log-rotation", "cli", "gzip", "sysadmin"]
categories = ["command-line-utilities"]

[lib]
name = "rotatelog"
path = "src/lib.rs"

[[bin]]
name = "rotatelog"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
flate2 = "1"
